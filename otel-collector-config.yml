# OpenTelemetry Collector config for Azure Monitor / Application Insights
# Used by .github/workflows/otel-appinsights.yml
# The azuremonitor exporter reads APPLICATIONINSIGHTS_CONNECTION_STRING from env

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  azuremonitor:
    connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, otlp/jaeger, azuremonitor]
      # exporters: [debug]
    logs:
      receivers: [otlp]
      exporters: [debug, azuremonitor]
      # exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug, azuremonitor]
