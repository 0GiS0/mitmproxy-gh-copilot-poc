# 🤖 Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2

updates:
  # 🐍 Python dependencies (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "⬆️ pip"
      include: "scope"
    labels:
      - "📦 dependencies"
      - "🐍 python"
    groups:
      # 🧪 Groups testing dependencies into a single PR
      testing:
        patterns:
          - "pytest*"
      # 🌐 Groups mitmproxy dependencies into a single PR
      mitmproxy:
        patterns:
          - "mitmproxy*"

  # ⚙️ GitHub Actions dependencies (in case workflows are added in the future)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "⬆️ actions"
      include: "scope"
    labels:
      - "📦 dependencies"
      - "⚙️ github-actions"
